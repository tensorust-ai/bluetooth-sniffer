[package]
name = "btsdr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bluetooth LE and BR (Classic) baseband sniffer for the HackRF One, with PCAP/PCAPNG output for Wireshark"
license = "MIT"
repository = "https://github.com/venglin/bluetooth-sniffer"
readme = "README.md"
keywords = ["bluetooth", "sdr", "hackrf", "wireshark", "ble"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.4"
num-complex = "0.4.6"
rustfft = "6.4.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The DSP code is painfully slow without optimisation; keep debug builds usable.
[profile.dev]
opt-level = 2
